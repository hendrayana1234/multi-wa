# Setiap kali package.json berubah di branch main (biasanya karena "version" dinaikkan),
# GitHub membangun installer Windows dan menerbitkannya ke halaman Releases dengan tag
# v<versi>. Aplikasi yang sudah terpasang akan mendeteksi rilis ini dan menawarkan pembaruan.
name: Rilis Windows

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Siapkan tag dan rilis
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = node -p "require('./package.json').version"
          $tag = "v$v"

          # Hapus rilis rusak/duplikat: semua rilis bertag $tag, dan rilis lama tanpa latest.yml.
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          foreach ($r in $releases) {
            $names = @($r.assets | ForEach-Object { $_.name })
            if ($r.tag_name -eq $tag -or -not ($names -contains 'latest.yml')) {
              Write-Host "Hapus rilis $($r.tag_name) (id $($r.id))"
              gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/releases/$($r.id)" | Out-Null
            }
          }

          # Buat tag jika belum ada, lalu buat SATU rilis kosong; electron-builder mengisinya.
          git tag $tag 2>$null
          git push origin $tag 2>$null
          gh release create $tag --title "Multi WA $v" --notes "Pembaruan otomatis tersedia dari dalam aplikasi." --latest
          exit 0

      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
